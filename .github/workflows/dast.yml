name: DAST

# Weekly passive scans of the built image (SDD 13): OWASP ZAP baseline and
# nuclei. Findings are reports, not a gate. Adapted from
# AlexGalhardo/vukem-marketplace-reactjs.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -t hexascore:dast .
      # The bare image exits at boot without a database and Stripe settings,
      # so start it through the compose "app" profile (Postgres, migrate, seed)
      # like the e2e and Lighthouse jobs do.
      - name: Start the app
        run: |
          export APP_KEY="base64:$(openssl rand -base64 32)"
          E2E_IMAGE_TAG=dast bash scripts/ci/qa-up.sh hexascore:dast
          curl -fsS localhost:3000/up
      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3000
          allow_issue_writing: false
          fail_action: false
      - name: nuclei
        uses: projectdiscovery/nuclei-action@cc153d0541e1adf8a42bbe31c0a4fb2376147538 # v3.1.1
        with:
          args: -u http://localhost:3000 -severity medium,high,critical -o nuclei.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dast-reports
          path: |
            report_html.html
            report_json.json
            nuclei.txt
          retention-days: 14
      - name: Stop the app
        if: always()
        run: docker compose --project-name hx-ci --profile app down -v
