name: Release

# Tag vX.Y.Z on main (ADR 0013): tests, then the image to GHCR and Docker Hub
# (smoke-tested before anything is pushed, signed and attested), then the
# GitHub release with the CHANGELOG section. Adapted from
# AlexGalhardo/vukem-marketplace-reactjs and the vukem release workflow.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing tag to release, for example v1.0.0
        required: true
        type: string

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.tag.outputs.stable }}
    steps:
      - name: Check the tag
        id: tag
        run: |
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::not a version tag: $VERSION"
              exit 1
              ;;
          esac
          # Only vX.Y.Z moves the image's latest tag; vX.Y.Z-rc.1 and friends do not.
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >>"$GITHUB_OUTPUT"
          else
            echo "stable=false" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERSION }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  # The image is built once for a smoke test and only then pushed, signed and
  # attested; a failing smoke stops the release before anything is published.
  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      GHCR_IMAGE: ghcr.io/alexgalhardo/hexascore-app
      HUB_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/hexascore-app
      STABLE: ${{ needs.test.outputs.stable }}
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # Sigstore OIDC identity for cosign and attestations
      attestations: write # build provenance attestation of the image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERSION }}
          persist-credentials: false
      - name: Resolve the image tags
        id: meta
        run: |
          version="${VERSION#v}"
          {
            echo "tags<<EOF"
            for image in "$GHCR_IMAGE" "$HUB_IMAGE"; do
              echo "$image:$version"
              if [ "$STABLE" = true ]; then
                echo "$image:${version%.*}"
                echo "$image:latest"
              fi
            done
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Smoke build: one platform, loaded into the local daemon, never pushed.
      # The push build below reuses its layers through the GitHub cache.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: hexascore:smoke
          build-args: APP_VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The bare image exits at boot without a database and Stripe settings,
      # so the smoke starts it through the compose "app" profile (Postgres,
      # migrate, seed), the same path the e2e and DAST jobs use.
      - name: Smoke test the image
        run: |
          export APP_KEY="base64:$(openssl rand -base64 32)"
          E2E_IMAGE_TAG=smoke bash scripts/ci/qa-up.sh hexascore:smoke
          code=000
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/up || true)"
            [ "$code" = 200 ] && break
            sleep 2
          done
          if [ "$code" != 200 ]; then
            echo "::error::the image answered $code on /up"
            docker compose --project-name hx-ci --profile app logs
            exit 1
          fi
      - name: Stop the smoke stack
        if: always()
        env:
          APP_KEY: smoke
          E2E_IMAGE_TAG: smoke
        run: docker compose --project-name hx-ci --profile app down -v
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: APP_VERSION=${{ env.VERSION }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # The same digest is in both registries, so each reference is signed.
      - name: Sign the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$GHCR_IMAGE@$DIGEST"
          cosign sign --yes "$HUB_IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/alexgalhardo/hexascore-app
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_USERNAME }}/hexascore-app
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERSION }}
          persist-credentials: false
      - name: Extract changelog section
        run: |
          version="${VERSION#v}"
          awk -v h="## [$version]" 'index($0, h) == 1 {p=1; next} p && index($0, "## [") == 1 {exit} p' CHANGELOG.md > release-notes.md
          # A tag without its CHANGELOG section must not publish (ROADMAP P2.B.2.2).
          test -s release-notes.md || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          tag_name: ${{ env.VERSION }}
